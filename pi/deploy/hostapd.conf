# IRPanoView Pi hotspot — STANDALONE / FIELD MODE (future)
#
# Not used while phone + Pi share an existing WiFi AP.
# When migrating off shared WiFi, configure hostapd + dnsmasq from this folder.

interface=wlan0
driver=nl80211
ssid=IRPanoView
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=irpanoview
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
